[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tvm-lucid"
version = "0.1.0"
description = "Terminal Velocity Matching (ICLR 2026) re-implemented on lucid-dl and trained from scratch on Apple Silicon"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Chan Lee" }]
keywords = ["generative-model", "flow-matching", "few-step", "diffusion", "apple-silicon", "metal", "lucid"]
classifiers = [
    "Environment :: GPU",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Pinned: the forward-mode JVP in tvm_lucid/tvm/layers.py exists because of
# how this release's lucid.func.jvp behaves; re-check before moving the pin.
dependencies = [
    "lucid-dl==3.15.5",
    "numpy",
    "tqdm",
    "pillow",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/lucid-official/tvm-lucid"
Repository = "https://github.com/lucid-official/tvm-lucid"
Paper = "https://arxiv.org/abs/2511.19797"
"Upstream (TVM)" = "https://github.com/lumalabs/tvm"
"Runtime (lucid-dl)" = "https://github.com/lucid-official/lucid"

[project.optional-dependencies]
test = ["pytest", "scipy"]
dev = ["pytest", "scipy", "ruff"]

[project.scripts]
tvm-train = "tvm_lucid.train:main"

[tool.setuptools.packages.find]
include = ["tvm_lucid*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tvm_lucid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
