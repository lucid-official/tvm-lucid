[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tvm-lucid"
version = "0.1.0"
description = "Terminal Velocity Matching (ICLR 2026) re-implemented on Lucid and trained from scratch on Apple Silicon"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Chan Lee" }]
keywords = ["generative-model", "flow-matching", "few-step", "diffusion", "apple-silicon", "metal", "lucid"]
classifiers = [
    "Environment :: GPU",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# 3.15.5 or a later Lucid, including a checkout of `main` (README, Install).
# The forward-mode JVP in tvm_lucid/tvm/layers.py does not rely on
# lucid.func.jvp, whose 3.15.5 form returns its tangent detached.
dependencies = [
    "lucid-dl>=3.15.5",
    # Lucid 3.15.5 was built against mlx 0.32.3; 0.32.4 changed the ABI
    # (mlx::core::array::set_data), and the engine fails to load against it.
    "mlx==0.32.3",
    "numpy",
    "tqdm",
    "pillow",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/lucid-official/tvm-lucid"
Repository = "https://github.com/lucid-official/tvm-lucid"
Paper = "https://arxiv.org/abs/2511.19797"
"Upstream (TVM)" = "https://github.com/lumalabs/tvm"
"Runtime (Lucid)" = "https://github.com/lucid-official/lucid"

[project.optional-dependencies]
test = ["pytest", "scipy"]
dev = ["pytest", "scipy", "ruff"]

[project.scripts]
tvm-train = "tvm_lucid.train:main"

[tool.setuptools.packages.find]
include = ["tvm_lucid*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tvm_lucid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
